<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settlement stats</title>
    <style>body { background: #0f1115; color: #8b949e; font: 14px ui-monospace, monospace; padding: 16px; }</style>
</head>
<body>
    <div id="app">Loading...</div>
    <script>
        // Same loader as index.html: revalidate style.css and stats.js so updates arrive on the next load.
        (async () => {
            const get = async u => {
                try { const r = await fetch(u, { cache: "no-cache" }); if (r.ok) return r.text(); } catch (e) { /* offline */ }
                const r = await fetch(u, { cache: "force-cache" });
                if (!r.ok) throw new Error(u + " (" + r.status + ")");
                return r.text();
            };
            try {
                const [css, js] = await Promise.all(["style.css", "stats.js"].map(get));
                const st = document.createElement("style"); st.textContent = css; document.head.append(st);
                const sc = document.createElement("script"); sc.textContent = js + "\n//# sourceURL=stats.js"; document.body.append(sc);
            } catch (e) { document.getElementById("app").textContent = "Could not load: " + e.message; }
        })();
    </script>
</body>
</html>
