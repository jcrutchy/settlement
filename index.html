<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settlement</title>
    <style>body { background: #0f1115; color: #8b949e; font: 14px ui-monospace, monospace; padding: 16px; }</style>
</head>
<body>
    <div id="app">Loading...</div>
    <script>
        // Tiny loader: always revalidates style.css, ui.html, game.js and world.js (a cheap 304 when unchanged),
        // so new versions arrive on the next page load with no manual refresh. Falls back to the
        // cached copies when offline.
        (async () => {
            const get = async u => {
                try { const r = await fetch(u, { cache: "no-cache" }); if (r.ok) return r.text(); } catch (e) { /* offline */ }
                const r = await fetch(u, { cache: "force-cache" });
                if (!r.ok) throw new Error(u + " (" + r.status + ")");
                return r.text();
            };
            const app = document.getElementById("app");
            try {
                const [css, ui, js, wjs] = await Promise.all(["style.css", "ui.html", "game.js", "world.js"].map(get));
                const st = document.createElement("style"); st.textContent = css; document.head.append(st);
                app.innerHTML = ui;
                // both scripts share one global scope: game.js is the engine, world.js adds AI neighbours and trade (its functions are only called after init's first fetch)
                [[js, "game.js"], [wjs, "world.js"]].forEach(([code, name]) => { const sc = document.createElement("script"); sc.textContent = code + "\n//# sourceURL=" + name; document.body.append(sc); });
            } catch (e) { app.textContent = "Could not load the game: " + e.message; }
        })();
    </script>
</body>
</html>
