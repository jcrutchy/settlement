<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settlement</title>
    <!-- Bump ?v= when you change style.css or game.js; gamedata.json revalidates itself. -->
    <link rel="stylesheet" href="style.css?v=0.5">
</head>
<body>
    <header>
        <div class="title-bar">
            <h1 id="game-h1">SETTLEMENT</h1>
            <button id="toggle-sync-btn" class="btn-subtle">⚙ Cloud Sync</button>
        </div>
        <div id="sync-panel" class="panel hidden">
            <h3>GitHub Secret Gist Sync</h3>
            <p class="hint">Stored locally in your browser only. Never committed to Git.</p>
            <div class="form-row">
                <input type="password" id="gist-token" placeholder="Fine-Grained PAT (Gist Read/Write)">
                <input type="text" id="gist-id" placeholder="Secret Gist ID">
            </div>
            <div class="button-row">
                <button id="push-gist-btn" class="btn-primary">⬆ Push Save to Gist</button>
                <button id="pull-gist-btn">⬇ Pull Save from Gist</button>
            </div>
            <div id="sync-status" class="status-text"></div>
        </div>
    </header>

    <main>
        <section id="log-panel" class="panel log-box"></section>

        <section class="panel">
            <h2>Stockpiles</h2>
            <div id="resources-list" class="grid-list"></div>
            <div id="manual-actions" class="button-row" style="margin-top: 12px;"></div>
        </section>

        <section class="panel">
            <div class="section-header">
                <h2>Land</h2>
                <span id="land-counter" class="badge">0 / 0 plots</span>
            </div>
            <p class="hint" id="seed-hint"></p>
            <div id="map" class="map"></div>
            <div class="button-row" style="margin: 10px 0; align-items: center;">
                <button id="claim-tile-btn" style="display:none;">Claim tile</button>
                <button id="move-btn" style="display:none;">Move</button>
                <button id="demolish-btn" class="btn-danger" style="display:none;">Demolish</button>
                <span id="tile-info" class="hint" style="margin: 0;"></span>
            </div>
            <div id="deposits-list" class="stack-list"></div>
        </section>

        <section class="panel" id="pop-section">
            <div class="section-header">
                <h2>Population</h2>
                <span id="pop-counter" class="badge">0 / 0</span>
            </div>
            <p class="hint">Idle villagers: <strong id="idle-pop">0</strong> <span id="needs-hint"></span></p>
            <div id="jobs-list" class="stack-list"></div>
        </section>

        <section class="panel">
            <h2>Structures</h2>
            <div id="buildings-list" class="stack-list"></div>
        </section>
    </main>

    <footer>
        <button id="local-save-btn" class="btn-subtle">Save Local</button>
        <button id="hard-reset-btn" class="btn-danger">New Run</button>
    </footer>

    <script src="game.js?v=0.5"></script>
</body>
</html>
