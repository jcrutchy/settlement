<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settlement</title>
    <style>body { background: #0f1115; color: #8b949e; font: 14px ui-monospace, monospace; padding: 16px; }</style>
</head>
<body>
    <div id="app">Loading...</div>
    <script>
        // Tiny loader: always revalidates style.css, ui.html, modules.json and every script it lists (a cheap 304 when unchanged),
        // so new versions arrive on the next page load with no manual refresh. Falls back to the
        // cached copies when offline.
        (async () => {
            const get = async u => {
                try { const r = await fetch(u, { cache: "no-cache" }); if (r.ok) return r.text(); } catch (e) { /* offline */ }
                const r = await fetch(u, { cache: "force-cache" });
                if (!r.ok) throw new Error(u + " (" + r.status + ")");
                return r.text();
            };
            const app = document.getElementById("app");
            try {
                const [css, ui, manifest] = await Promise.all(["style.css", "ui.html", "modules.json"].map(get));
                const M = JSON.parse(manifest), core = M.core || [], mods = M.mods || [];
                const code = await Promise.all([...core.map(get), ...mods.map(u => get(u).catch(e => { console.warn("mod not loaded: " + u + " (" + e.message + ")"); return null; }))]);
                const st = document.createElement("style"); st.textContent = css; document.head.append(st);
                app.innerHTML = ui;
                // classic scripts in manifest order, sharing one global scope: core modules first, then mods (a mod that fails to load is skipped)
                [...core, ...mods].forEach((name, i) => { if (code[i] === null) return; const sc = document.createElement("script"); sc.textContent = code[i] + "\n//# sourceURL=" + name; document.body.append(sc); });
                await Settlement.start();
            } catch (e) { app.textContent = "Could not load the game: " + e.message; }
        })();
    </script>
</body>
</html>
